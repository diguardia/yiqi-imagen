name: React Design System

on:
  push:
    branches:
      - agent/next-react-design-system
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package.json'
      - '.github/workflows/react-design-system.yml'

concurrency:
  group: react-design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm install --no-package-lock

      - name: Audit production dependencies
        run: npm audit --omit=dev --audit-level=high

      - name: Blocking guards for new React surface
        run: npm test

      - name: Inventory legacy DS contract debt
        run: npm run test:clases-ds:legacy

      - name: Build UI and Next.js catalog
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: E2E and visual checkpoints
        run: npm run test:e2e

      - name: Upload Playwright report and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-design-system-playwright
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
