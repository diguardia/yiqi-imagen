name: React Design System

on:
  push:
    branches:
      - agent/next-react-design-system
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'package.json'
      - '.github/workflows/react-design-system.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install workspace dependencies
        run: npm install --no-package-lock

      - name: Typecheck
        run: npm run typecheck

      - name: Build UI and Next.js catalog
        run: npm run build
