name: React Design System

on:
  push:
    branches:
      - GabrielFarias/next-react-design-system
  pull_request:
    paths:
      - 'apps/docs/**'
      - 'packages/ui/**'
      - 'tests/e2e/**'
      - 'scripts/**'
      - 'playwright.config.ts'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/react-design-system.yml'

concurrency:
  group: react-design-system-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Instalar dependencias reproducibles
        run: npm ci

      - name: Auditar dependencias productivas
        run: node scripts/check-production-audit.js

      - name: Ejecutar guards bloqueantes
        run: npm test

      - name: Inventariar deuda legacy del contrato DS
        run: npm run test:clases-ds:legacy

      - name: Compilar UI y catalogo Next.js
        run: npm run build

      - name: Verificar que el build no modifique archivos versionados
        run: git diff --exit-code -- .

      - name: Instalar Chromium para Playwright
        run: npx playwright install --with-deps chromium

      - name: Ejecutar pruebas de regresion funcional
        run: npm run test:regresion:e2e

      - name: Subir reporte de regresion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: react-design-system-regresion
          path: |
            playwright-report
            test-results
          if-no-files-found: warn
          retention-days: 14
