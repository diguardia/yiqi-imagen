<div class="nav-overlay" id="app-overlay"></div>

<script src="../yiqi-runtime.js"></script>
<script>
  /* ?open=1 deja el drawer abierto: lo usa la documentacion para
     mostrar los dos estados uno al lado del otro. */
  var _q = new URLSearchParams(location.search);
  /* ?notch=N simula el safe area del iPhone: la topbar y el drawer bajan
     su contenido N px, pero sus fondos pasan por debajo de la isla. */
  if (_q.has('notch')) {
    var n = parseInt(_q.get('notch'), 10) || 0;
    addEventListener('DOMContentLoaded', function () {
      document.querySelector('.topbar').style.paddingTop = (12 + n) + 'px';
      document.getElementById('app-sidebar').style.paddingTop = (20 + n) + 'px';
    });
  }
  if (_q.has('open')) {
    addEventListener('DOMContentLoaded', function () {
      document.getElementById('app-sidebar').classList.add('is-open');
      document.getElementById('app-overlay').classList.add('is-open');
      document.querySelector('.nav-hamburger').setAttribute('aria-expanded', 'true');
    });
  }
  addEventListener('message', function (e) {
    if (e.data && e.data.theme) document.documentElement.setAttribute('data-theme', e.data.theme);
  });
</script>

</body>
</html>
