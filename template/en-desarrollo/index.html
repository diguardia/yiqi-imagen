<!DOCTYPE html>
<html lang="es" data-theme="system">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>En desarrollo — YiQi</title>
  <meta name="robots" content="noindex,nofollow">
  <!-- Pagina "En desarrollo" para los subdominios de apps que todavia no estan
       disponibles (contable, stocktalle, etc.). La sirve cada app como pagina por
       defecto o como respuesta 404. El nombre de la app sale del subdominio
       (APPS, abajo) o de ?app=Nombre. Estilos: DS canonico, sin copiar CSS. -->
  <link rel="stylesheet" href="https://diguardia.github.io/yiqi-imagen/styles.css">
  <script src="https://diguardia.github.io/yiqi-imagen/yiqi-runtime.js" defer></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px 16px; background: var(--bg); color: var(--text); font: 16px/1.5 var(--sans); }
    .ed { display: grid; justify-items: center; text-align: center; gap: 14px; max-width: 46ch; }
    .ed-logo { width: 96px; height: auto; color: var(--text); margin-bottom: 8px; }
    .ed .badge { margin-top: 4px; }
    .ed h1 { margin: 0; font: 700 clamp(24px, 4vw, 32px)/1.2 var(--sans); letter-spacing: -.01em; }
    .ed p { margin: 0; color: var(--muted); }
    .ed-actions { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 10px; }
  </style>
</head>
<body>
  <main class="ed">
            <svg data-yiqi-logo data-axis="y" class="ed-logo" viewBox="0 0 100 65" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="YiQi" onclick="YiQiLogo.play(this,{force:true})"><g class="yq-all anim"><path class="yq-y yql anim" d="M20.44,48.34l2.57-6.15-6.79-16.91c-.14-.39.07-.61.46-.61h4.97c.29,0,.57.14.68.43l3.58,10.08,3.61-10.08c.11-.29.39-.43.68-.43h4.97c.39,0,.57.21.43.61l-9.26,23.27c-.11.29-.39.43-.68.43h-4.75c-.43,0-.68-.21-.47-.64Z"/><path class="yq-i1s yql anim" d="M38.72,25.24c0-.32.25-.57.57-.57h4.89c.32,0,.57.25.57.57v16.24c0,.32-.25.57-.57.57h-4.89c-.32,0-.57-.25-.57-.57v-16.24Z"/><g class="yq-q anim"><path class="yqs" d="M57.91,44.78v-2.66c-2.18-.53-4.21-1.66-5.92-3.36-4.97-4.97-5.09-13.02-.03-18.08,5.09-5.09,13.14-4.97,18.11,0s5.09,13.02,0,18.11c-1.78,1.78-3.94,2.93-6.22,3.46v2.51c0,.35-.18.53-.58.53h-4.82c-.3,0-.55-.2-.55-.5ZM56.28,34.47c.5.5,1.05.9,1.65,1.2v-3.36c0-.35.18-.53.53-.53h4.87c.25,0,.53.18.53.53v3.36c.63-.33,1.23-.78,1.78-1.33,2.73-2.73,2.78-6.75.15-9.38s-6.67-2.61-9.41.13c-2.71,2.71-2.73,6.75-.1,9.38Z"/></g><path class="yq-i2s yql anim" d="M77.44,25.24c0-.32.25-.57.57-.57h4.89c.32,0,.57.25.57.57v16.24c0,.32-.25.57-.57.57h-4.89c-.32,0-.57-.25-.57-.57v-16.24Z"/><path class="yq-i1d yql anim" d="M38.5,18.99c0-1.77,1.35-3.19,3.23-3.19s3.23,1.42,3.23,3.19-1.38,3.23-3.23,3.23-3.23-1.42-3.23-3.23Z"/><path class="yq-i2d yql anim" d="M77.22,18.99c0-1.77,1.35-3.19,3.23-3.19s3.23,1.42,3.23,3.19-1.38,3.23-3.23,3.23-3.23-1.42-3.23-3.23Z"/></g></svg>
    <span class="badge badge-amber">En desarrollo</span>
    <h1 id="ed-title">Esta app está en desarrollo</h1>
    <p>Todavía no está disponible. Mientras tanto, puedes ver las apps que ya funcionan con YiQi.</p>
    <div class="ed-actions">
      <a class="btn btn-primary" href="https://www.yiqi.com.ar/marketplace.html">Ver el Marketplace</a>
      <a class="btn btn-ghost" href="https://www.yiqi.com.ar/">Ir a yiqi.com.ar</a>
    </div>
  </main>
  <script>
    (function () {
      /* Subdominio → nombre publicado en apps-data.js de www.yiqi. */
      var APPS = {
        contable: 'YiQi Contable',
        stocktalle: 'YiQi Talles y Colores',
        inventario: 'YiQi Inventario',
        resumen: 'YiQi Resumen de Tarjeta'
      };
      var q = new URLSearchParams(location.search).get('app');
      var sub = location.hostname.split('.')[0];
      var name = q || APPS[sub];
      if (name) {
        document.getElementById('ed-title').textContent = name + ' está en desarrollo';
        document.title = name + ' — En desarrollo';
      }
    })();
  </script>
</body>
</html>
